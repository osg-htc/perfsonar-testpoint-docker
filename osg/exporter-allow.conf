# OSG default allow-list for the Prometheus exporters
# (/node_exporter and /perfsonar_host_exporter, plus the /metrics alias).
#
# Included by /etc/apache2/conf-available/osg-exporter-acl.conf inside a
# <RequireAny> block, so every line here is an Apache 2.4 "Require" directive.
# Loopback (Require local) is always allowed by that file.
#
# To use a site-specific list, bind-mount your own file over
# /etc/apache2/osg/exporter-allow.conf (for example from
# /opt/perfsonar-tp/conf/exporter-allow.conf) and reload Apache.

# AGLT2: OSG/WLCG central perfSONAR monitoring (psetf) and related services
Require ip 2001:48a8:68f7::/48
Require ip 192.41.230.0/23
Require ip 192.41.236.0/23

# CERN
Require ip 2001:1458:d00::/48
Require ip 2001:1458:d03::/48
Require ip 2001:1458:301::/48
Require ip 2001:1458:302::/48
Require ip 2001:1458:303::/48
Require ip 188.184.0.0/17
Require ip 188.185.0.0/17
Require ip 188.185.128.0/18
Require ip 128.142.0.0/16
