# OSG: restrict the Prometheus exporters served by this testpoint.
#
# The packaged configs open both exporters to everyone:
#   apache-node_exporter.conf           ProxyPass /node_exporter, <Proxy *> Require all granted
#   apache-perfsonar_host_exporter.conf WSGIScriptAlias /perfsonar_host_exporter, Require all granted
# <Location> sections are merged after <Directory> and <Proxy> sections, so the
# rules below take precedence.
#
# The allowed networks are in /etc/apache2/osg/exporter-allow.conf; sites can
# replace that file with a bind mount. Loopback is always allowed so that local
# checks (perfSONAR-diagnostic-report.sh, health monitor) keep working.

# Kept for compatibility with earlier OSG images, which served node_exporter here too.
ProxyPass        /metrics http://localhost:9100/metrics
ProxyPassReverse /metrics http://localhost:9100/metrics

<Location /metrics>
    <RequireAny>
        Require local
        Include /etc/apache2/osg/exporter-allow.conf
    </RequireAny>
</Location>

<Location /node_exporter>
    <RequireAny>
        Require local
        Include /etc/apache2/osg/exporter-allow.conf
    </RequireAny>
</Location>

<Location /perfsonar_host_exporter>
    <RequireAny>
        Require local
        Include /etc/apache2/osg/exporter-allow.conf
    </RequireAny>
</Location>
